name: Verify curated exposition release
on:
  pull_request:
    paths: ['release/**', '.github/workflows/exposition-release.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: exposition-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Qualify release boundaries
        run: python -m unittest discover -s release -p 'test_*.py' -v
      - name: Install only exposition dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Assemble and reproduce the actual isolated public payload
        run: python release/build_bundle.py
      - name: Retain release archive and actual verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: exposition-release-${{ github.sha }}
          path: build/public-release-v1/
          if-no-files-found: warn
          retention-days: 30
          include-hidden-files: true
