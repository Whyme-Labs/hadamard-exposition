name: Verify curated exposition release
# Legacy v1 recovery/build workflow. Local execution comes first; launch this
# home-runner fallback manually only after recording the concrete local blocker.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: exposition-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    env:
      EXPECTED_SHA: ${{ github.sha }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - name: Require the authorized home runner
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = home-ci-01
          test "$RUNNER_OS" = Linux
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify source and prepare private local-recovery bundle
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          mkdir -p build
          git bundle create build/hadamard-source.bundle HEAD
          sha256sum build/hadamard-source.bundle > build/hadamard-source.bundle.sha256
      - name: Retain private source for local execution
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: private-source-${{ env.EXPECTED_SHA }}
          path: |
            build/hadamard-source.bundle
            build/hadamard-source.bundle.sha256
          if-no-files-found: error
          retention-days: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: Qualify release boundaries
        run: python -m unittest discover -s release -p 'test_*.py' -v
      - name: Install only exposition dependencies in an isolated environment
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/hadamard-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          "$RUNNER_TEMP/hadamard-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/bin/python" -m pip install --disable-pip-version-check -r requirements.txt
      - name: Assemble and reproduce the actual isolated public payload
        shell: bash
        run: '"$RUNNER_TEMP/hadamard-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/bin/python" release/build_bundle.py'
      - name: Retain release archive and actual verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: exposition-release-${{ env.EXPECTED_SHA }}
          path: build/public-release-v1/
          if-no-files-found: warn
          retention-days: 30
          include-hidden-files: true
