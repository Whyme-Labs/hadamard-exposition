name: Retain v2 reproduction evidence
# The first 100-seed study, exact checks and browser checks ran locally.
# This explicitly scoped second run preserves full records in the private repo.
# Home source-recovery run 39463443466 did not execute. Actions artifact storage
# is full, confirmed by job 118775965668. Never overwrite the local observation.
on:
  pull_request:
    paths: ['.github/workflows/v2-evidence-retention.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hadamard-v2-evidence-${{ github.ref }}
  cancel-in-progress: false
jobs:
  preserve:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - name: Verify original local scientific source identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('strengthening')
          old=json.loads((root/'local-run-receipt.json').read_text())
          for name,expected in old['source_sha256'].items():
              if hashlib.sha256((root/name).read_bytes()).hexdigest()!=expected:
                  raise SystemExit('Scientific source mismatch: '+name)
          print('All five original source/protocol identities match the local observation.')
          PY
          python -m pip install --disable-pip-version-check -r requirements-v2.txt
          mkdir -p build/v2-reproduction-evidence
      - name: Execute source-bound tests and separate same-protocol reproduction
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s strengthening -p 'test_*.py' -v 2>&1 | tee build/v2-reproduction-evidence/tests.txt
          timeout 180s python strengthening/study.py --output build/v2-reproduction-evidence/run > build/v2-reproduction-evidence/study-console.txt
          python strengthening/verify_study.py build/v2-reproduction-evidence/run > build/v2-reproduction-evidence/independent-audit.json
          python strengthening/counterexample_family.py > build/v2-reproduction-evidence/family-linear-checks.json
      - name: Compare with the original local observation without overwriting it
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,json,pathlib,math
          root=pathlib.Path('build/v2-reproduction-evidence')
          local=json.loads(pathlib.Path('strengthening/local-run-receipt.json').read_text())
          new=json.loads((root/'run/receipt.json').read_text())
          comparisons=[]
          for arm,old in local['primary']['arms'].items():
              fresh=new['primary']['arms'][arm]
              for field in ('mean_error','mean_delta_vs_original'):
                  if not math.isclose(old[field],fresh[field],rel_tol=2e-12,abs_tol=2e-14):
                      raise SystemExit('Primary result mismatch')
                  comparisons.append(arm+'.'+field)
              if old['wins_vs_original']!=fresh['wins_vs_original']:
                  raise SystemExit('Primary win count mismatch')
          report={'status':'passed','scope':'Separate cross-environment reproduction, not the original local observation or new-data validation.',
                  'source_commit':__import__('os').environ['EXPECTED_SHA'],
                  'original_local_started_utc':local['started_utc'],'reproduction_started_utc':new['started_utc'],
                  'primary_fields_compared':comparisons,
                  'raw_cells_byte_identical_to_original':new['output_sha256']['cells.csv']==local['output_sha256']['cells.csv'],
                  'original_cells_sha256':local['output_sha256']['cells.csv'],
                  'reproduced_cells_sha256':new['output_sha256']['cells.csv'],
                  'public_release':False}
          (root/'comparison.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report,indent=2))
          PY
      - name: Preserve complete new raw records on a new private evidence branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python - <<'PY'
          import base64,json,os,pathlib,urllib.request
          root=pathlib.Path('build/v2-reproduction-evidence')
          repo=os.environ['GITHUB_REPOSITORY']
          if repo!='Whyme-Labs/hadamard-exposition': raise SystemExit('Unexpected repository')
          if json.loads((root/'comparison.json').read_text())['status']!='passed': raise SystemExit('Acceptance required')
          def post(path,data):
              req=urllib.request.Request('https://api.github.com/repos/'+repo+path,data=json.dumps(data).encode(),method='POST',headers={
                  'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              with urllib.request.urlopen(req,timeout=60) as response: return json.load(response)
          names=['run/cells.csv','run/inputs.json','run/summary.json','run/exact-checks.json','run/receipt.json',
                 'tests.txt','study-console.txt','independent-audit.json','family-linear-checks.json','comparison.json']
          entries=[]
          for name in names:
              data=(root/name).read_bytes()
              blob=post('/git/blobs',{'content':base64.b64encode(data).decode(),'encoding':'base64'})
              entries.append({'path':name,'mode':'100644','type':'blob','sha':blob['sha']})
          tree=post('/git/trees',{'tree':entries})
          commit=post('/git/commits',{'message':'Retain separate v2 reproduction '+os.environ['GITHUB_RUN_ID'],
                                    'tree':tree['sha'],'parents':[]})
          branch='evidence/v2-reproduction-'+os.environ['GITHUB_RUN_ID']
          post('/git/refs',{'ref':'refs/heads/'+branch,'sha':commit['sha']})
          print(json.dumps({'private_evidence_branch':branch,'commit':commit['sha'],'files':entries},indent=2))
          PY
