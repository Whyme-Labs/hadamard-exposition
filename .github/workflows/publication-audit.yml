name: Review publication audit findings
# Temporary branch/path-scoped follow-up to audit run 39549217108.
# Local tests pass; local full-history transfer and home execution remain blocked.
# This trigger will be removed before merge. No visibility change occurs.
on:
  push:
    branches: ['work/issue11-publication-audit']
    paths: ['publication/review_findings.py']
  workflow_dispatch:
permissions:
  contents: write
  actions: write
  issues: read
  pull-requests: write
jobs:
  review:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    env:
      EXPECTED_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Test and resolve the identified flags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python3 -W error::ResourceWarning -m unittest discover -s publication -p 'test_*.py' -v
          python3 publication/review_findings.py
      - name: Retain the redacted review record
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64,json,os,pathlib,urllib.request
          repo=os.environ['GITHUB_REPOSITORY']
          assert repo=='Whyme-Labs/hadamard-exposition'
          path=pathlib.Path('build/publication-review/review.json')
          def post(endpoint,data):
              req=urllib.request.Request('https://api.github.com/repos/'+repo+endpoint,data=json.dumps(data).encode(),method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              with urllib.request.urlopen(req,timeout=45) as response:return json.load(response)
          blob=post('/git/blobs',{'content':base64.b64encode(path.read_bytes()).decode(),'encoding':'base64'})
          tree=post('/git/trees',{'tree':[{'path':'review.json','mode':'100644','type':'blob','sha':blob['sha']}]})
          commit=post('/git/commits',{'message':'Retain publication findings review '+os.environ['GITHUB_RUN_ID'],'tree':tree['sha'],'parents':[]})
          branch='evidence/publication-review-'+os.environ['GITHUB_RUN_ID']+'-'+os.environ['GITHUB_RUN_ATTEMPT']
          post('/git/refs',{'ref':'refs/heads/'+branch,'sha':commit['sha']})
          print(json.dumps({'evidence_branch':branch,'commit':commit['sha'],'status':json.loads(path.read_text())['review_status']},indent=2))
          PY
